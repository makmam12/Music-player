<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="cover-art-wrapper">

        <img src="" alt="" class="cover-art" />
              <div class="bars-or-lyrics">
        <div class="lyrics"></div>
        <div class="bars-container"></div>
      </div>
      </div>
      <div class="music-info">
        <div class="trach-info">
          <div class="track-title"></div>
          <div class="track-artist"></div>
          <div class="track-album"></div>
          <div class="genre"></div>
        </div>
      </div>

      
      <div class="play-list"></div>
      <div class="recently-played-list">

      </div>
      <div class="new-input">
        <div id="dropZone">
          Drag & drop an audio file here<br />or click to browse
        </div>
        <input type="file" id="fileInput" accept="audio/*" />
        <audio src="" id="audio"></audio>
      </div>
    </div>
    <div class="volume-wrapper">

      <input
      type="range"
      id="volume-bar"
      min="0"
      max="1"
      step="0.01"
      value="0.5" />
    </div>
        <div class="controls">
          <div class="bottons">
            
            <button class="play-next">next</button>
            <button class="play-btn">play</button>
            <button class="play-previous">back</button>
          </div>
          <span class="current-time">0:00</span>
          <input type="range" class="seek-bar" min="0" max="100" value="0" step="0.1" />
          <div class="duration"></div>
       
      </div>
  </body>
  <script src="index.js" type="module"></script>
</html>
